general:
  seed: 42
  target_crop: 176
  unchanged_crops: [1, 5, 23, 176]

data_loader:
  train_path: './training_data112/train_patches.npy'
  val_path: './training_data112/val_patches.npy'
  batch_size: 1
  crop_band_index: 18
  device: 'cuda'
  train:
    min_ratio: 0.1
    max_ratio: 0.9
  val:
    min_ratio: 0.1
    max_ratio: 0.9

paths:
  checkpoint_dir: './checkpoints/v2'
  save_dir: 'checkpoints/finetune'

training:
  d_star: 1.0
  window_size: 30
  img_height: 112
  img_width: 112
  learning_rate: 0.0001
  loss_type: 'rayleigh_quotient' # options: 'signed_laplacian', 'normalized_correlation', 'mse', 'rayleigh_quotient'
  num_epochs: 50
  validation_steps: 200 # Add step-based validation
  accumulation_steps: 64
  solver:
    type: 'unrolled_lanczos'
    iterations: 20
    rayleigh_iterations: 15
    # Planned: init_strategy: 'random' | 'fixed' | 'learned'

validation:
  img_height: 112
  img_width: 112
  solver:
    type: 'unrolled_lanczos'
    iterations: 20
    rayleigh_iterations: 40
