general:
  seed: 42
  target_crop: 176
  unchanged_crops: [1, 5, 23, 176]

data_loader:
  train_path: './training_data32/train_patches.npy'
  val_path: './training_data32/val_patches.npy'
  batch_size: 4
  crop_band_index: 18
  device: 'cuda'
  min_ratio: 0.1
  max_ratio: 0.9

paths:
  checkpoint_dir: './checkpoints/v2'
  save_dir: 'checkpoints/finetune'

training:
  d_star: 1.0
  window_size: 30
  img_height: 32
  img_width: 32
  learning_rate: 0.0001
  loss_type: 'signed_laplacian' # options: 'signed_laplacian', 'normalized_correlation'
  num_epochs: 50
  accumulation_steps: 16
  solver:
    type: 'rayleigh'
    iterations: 200
    # Planned: init_strategy: 'random' | 'fixed' | 'learned'

validation:
  img_height: 112
  img_width: 112
  solver:
    type: 'lanczos'
    tol: 1e-7
